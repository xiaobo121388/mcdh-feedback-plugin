[package]
name = "mcdh-feedback-helper"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "0.22.1"
ecb = { version = "0.2.1", features = ["alloc"] }
fs2 = "0.4.3"
hex = "0.4.3"
keyring = "4.1.6"
num-bigint = "0.4.6"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "query", "rustls", "system-proxy"] }
rsa = "0.9.8"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sm4 = "0.6.0"
tempfile = "3.23.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }
zeroize = "1.8.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
